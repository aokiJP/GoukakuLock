# 合格ロック — Xcode プロジェクトの定義(XcodeGen)。
#   brew install xcodegen && xcodegen generate   →   GoukakuLock.xcodeproj ができる
#
# Bundle ID と App Group を変えるときは、下の 3 つの値(&bundle / &group / refresh)をまとめて書き換える。
# 有料の Apple Developer Program では、4 つの Bundle ID(本体・monitor・shieldconfig・shieldaction)すべてに
# Family Controls と App Groups(同じ ID)を付ける。

name: GoukakuLock

options:
  bundleIdPrefix: com.aokijp
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # 自分のチームで署名するときは、ここに Team ID を入れる(Xcode の Signing & Capabilities でも可)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # 拡張は別スレッドから呼ばれるので、既定のアクター分離は nonisolated のまま(第16.3節)
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  GoukakuCore:
    path: GoukakuCore
  GoukakuKit:
    path: GoukakuKit
  # 相棒AI:芯(Foundation だけ)と、MLX で端末の中のモデルを動かす部分
  GoukakuAI:
    path: GoukakuAI
  GoukakuAIMLX:
    path: GoukakuAIMLX

targets:
  GoukakuLock:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/UI
      - path: Shared/Intents
      - path: Widgets/Views
      # モデルの目録(ダウンロードと説明に使う。CI もこれを読んでモデルごとの IPA を作る)
      - path: AI/models.json
        buildPhase: resources
    dependencies:
      - package: GoukakuCore
      - package: GoukakuKit
      - package: GoukakuKit
        product: GoukakuShared
      - package: GoukakuAI
      - package: GoukakuAIMLX
      - target: GoukakuMonitor
      - target: GoukakuShieldConfig
      - target: GoukakuShieldAction
      - target: GoukakuWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 合格ロック
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.aokijp.goukakulock.refresh
        GoukakuAppGroupID: &group group.com.aokijp.goukakulock
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: 証拠写真を撮るために使います。写真はこの iPhone の中だけに保存し、位置情報は残しません。
        # ファイル App・Finder から AIModels フォルダにモデルを置けるように
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aokijp.goukakulock
            CFBundleURLSchemes:
              - goukakulock
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.aokijp.goukakulock.quick.checkin
            UIApplicationShortcutItemTitle: チェックイン
            UIApplicationShortcutItemSubtitle: 今日のコミットを記録
            UIApplicationShortcutItemIconSymbolName: checkmark.seal
          - UIApplicationShortcutItemType: com.aokijp.goukakulock.quick.timer
            UIApplicationShortcutItemTitle: 集中タイマー
            UIApplicationShortcutItemSubtitle: アプリを開いている時間だけ数える
            UIApplicationShortcutItemIconSymbolName: timer
    entitlements:
      path: App/GoukakuLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - *group
        # 相棒AI:大きなモデル(Gemma 4 E2B など)を端末の中で動かすため。App ID の「Increased Memory Limit」と対
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: &bundle com.aokijp.goukakulock
        PRODUCT_NAME: GoukakuLock
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Sumi AppIcon-Kin AppIcon-Sakura"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GoukakuMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Monitor
    dependencies:
      - package: GoukakuCore
      - package: GoukakuKit
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: GoukakuMonitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoukakuAppGroupID: *group
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension
    entitlements:
      path: Extensions/Monitor/GoukakuMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - *group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aokijp.goukakulock.monitor
        TARGETED_DEVICE_FAMILY: "1"

  GoukakuShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfig
    dependencies:
      - package: GoukakuCore
      - package: GoukakuKit
    info:
      path: Extensions/ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: GoukakuShieldConfig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoukakuAppGroupID: *group
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigExtension
    entitlements:
      path: Extensions/ShieldConfig/GoukakuShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - *group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aokijp.goukakulock.shieldconfig
        TARGETED_DEVICE_FAMILY: "1"

  GoukakuShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
    dependencies:
      - package: GoukakuCore
      - package: GoukakuKit
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: GoukakuShieldAction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoukakuAppGroupID: *group
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldAction/GoukakuShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - *group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aokijp.goukakulock.shieldaction
        TARGETED_DEVICE_FAMILY: "1"

  # ホーム画面・ロック画面・StandBy のウィジェット、Live Activity、コントロールセンターのボタン
  # (Family Controls は使わないので、App Groups だけ)
  GoukakuWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Extension
      - path: Widgets/Views
      - path: Shared/UI
      - path: Shared/Intents
    dependencies:
      - package: GoukakuCore
      - package: GoukakuKit
        product: GoukakuShared
    info:
      path: Widgets/Extension/Info.plist
      properties:
        CFBundleDisplayName: 合格ロック
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoukakuAppGroupID: *group
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Extension/GoukakuWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - *group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aokijp.goukakulock.widget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  # シミュレータで画面を一通り動かしてスクリーンショットを撮る UI テスト(CI で実行)
  GoukakuLockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GoukakuLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aokijp.goukakulock.uitests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GoukakuLock:
    build:
      targets:
        GoukakuLock: all
    run:
      config: Debug
    test:
      config: Debug
      # UI テストではデバッガをつながない(大きくなったアプリに LLDB をつなぐと、起動待ちが切れることがある)
      debugEnabled: false
      targets:
        - GoukakuLockUITests
    archive:
      config: Release
